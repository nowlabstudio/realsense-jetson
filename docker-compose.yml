# RealSense D435i Docker Stack
# Jetson Orin Nano 8GB · JetPack 6.x · ROS2 Jazzy
#
# librealsense RSUSB backenddel (forrásból) + realsense-ros (colcon overlay)
# L4T kernel nem tartalmazza a hid_sensor_custom modult → RSUSB = standard Jetson megoldás
#
# Indítás:  docker compose up -d
# Build:    docker compose build
# Logok:    docker compose logs -f ros2-realsense

services:

  ros2-realsense:
    image: ros2-realsense:jazzy-isaac
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    container_name: ros2_realsense
    runtime: nvidia
    network_mode: host
    ipc: host
    restart: unless-stopped
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/video2:/dev/video2
      - /dev/video3:/dev/video3
      - /dev/video4:/dev/video4
      - /dev/video5:/dev/video5
      - /dev/hidraw0:/dev/hidraw0
      - /dev/hidraw1:/dev/hidraw1
      - /dev/hidraw2:/dev/hidraw2
      - /dev/hidraw3:/dev/hidraw3
      - /dev/hidraw4:/dev/hidraw4
      - /dev/hidraw5:/dev/hidraw5
      - /dev/hidraw6:/dev/hidraw6
    volumes:
      - /run/udev:/run/udev:ro
      - /tmp/.ros:/tmp/.ros
      - ../talicska-robot/cyclonedds.xml:/cyclonedds.xml:ro
      - ./realsense_params.yaml:/realsense_params.yaml:ro
    group_add:
      - video
      - plugdev
      - "101"    # input group (hidraw hozzáférés)
    ulimits:
      rtprio: 99       # USB transfer threadek real-time prioritáshoz
      memlock: -1      # memory lock korlát feloldva
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,compute,video,utility,graphics
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - CYCLONEDDS_URI=file:///cyclonedds.xml
    # Audit #7 Stress Test — RGB + Depth + PointCloud aktív, IMU letiltva
    # PointCloud a realsense_params.yaml-on keresztül van engedélyezve (config_file).
    # Alap konfig visszaállításhoz: git checkout HEAD -- realsense-jetson/docker-compose.yml
    command: >-
      bash -c "export PATH=/opt/ros/jazzy/install/bin:$$PATH &&
      source /opt/ros/jazzy/setup.bash &&
      source /opt/realsense_ws/install/setup.bash &&
      ros2 launch realsense2_camera rs_launch.py
      initial_reset:=false
      config_file:=/realsense_params.yaml
      enable_color:=true
      enable_depth:=true
      enable_infra1:=true
      enable_infra2:=true
      enable_accel:=true
      enable_gyro:=true
      enable_sync:=false
      depth_module.depth_profile:=848x480x30
      accelerate_gpu_with_glsl:=false"
